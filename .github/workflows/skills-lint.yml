name: skills lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml==6.0.2
      - name: Static checks over every skill
        run: python -I evals/lint.py
      - name: Skill lint regression tests
        run: python -I -m unittest discover -s evals -p test_lint.py -v
      - name: Retrospective collector regression tests
        run: python -I -m unittest discover -s agent-retrospective/tests -v
